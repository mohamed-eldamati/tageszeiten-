<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guten Morgen, Tag, Abend, Gute Nacht</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#10142b;color:#fff}
#scene{position:relative;width:100%;height:62vh;min-height:300px;overflow:hidden;transition:none}
#stars{position:absolute;inset:0;opacity:0}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%}
#sun,#moon{position:absolute;font-size:64px;transform:translate(-50%,-50%);line-height:1}
#city{position:absolute;left:0;right:0;bottom:0;height:22%;display:flex;align-items:flex-end;justify-content:space-around;background:linear-gradient(#2b2f3f,#1b1e2b)}
.h{width:13%;background:#232738;border-radius:4px 4px 0 0;position:relative}
.h i{position:absolute;width:22%;height:12%;left:20%;background:#ffd86b;opacity:0;border-radius:2px;box-shadow:0 0 8px #ffd86b}
.h i:nth-child(2){left:58%}.h i:nth-child(3){top:32%;left:20%}.h i:nth-child(4){top:32%;left:58%}
.h i:nth-child(1),.h i:nth-child(2){top:12%}
#clock{position:absolute;top:12px;right:14px;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:30px;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
#hello{position:absolute;left:0;right:0;top:50%;transform:translateY(-62%);text-align:center;cursor:pointer;padding:0 10px}
#hello b{display:block;font-size:clamp(34px,9vw,76px);text-shadow:0 3px 14px rgba(0,0,0,.45);transition:transform .3s}
#hello small{display:inline-block;margin-top:8px;font-size:clamp(16px,4vw,24px);background:rgba(0,0,0,.4);padding:4px 16px;border-radius:20px}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:.2}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
#ui{padding:14px;max-width:900px;margin:auto}
#btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#btns button{border:0;border-radius:14px;padding:10px 4px;color:#fff;font-size:clamp(13px,3.4vw,18px);font-weight:700;cursor:pointer;line-height:1.3;border:3px solid transparent}
#btns button span{display:block;font-size:clamp(22px,6vw,34px)}
#btns button small{display:block;font-weight:400;opacity:.9}
#btns button.on{border-color:#fff;transform:scale(1.04)}
.b0{background:#e8883a}.b1{background:#2a8bd6}.b2{background:#9a4fb0}.b3{background:#2e3a7a}
#bar{display:flex;gap:10px;align-items:center;margin-top:14px}
#play{border:0;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;background:#fff;color:#111;flex:none}
#t{flex:1;height:10px}
</style>
</head>
<body>
<div id="scene">
  <div id="stars"></div>
  <div id="sun">☀️</div>
  <div id="moon">🌙</div>
  <div id="clock">00:00</div>
  <div id="hello"><b id="g">Guten Morgen</b><small id="r">5–10 Uhr</small></div>
  <div id="city"></div>
</div>
<div id="ui">
  <div id="btns"></div>
  <div id="bar"><button id="play" aria-label="Play/Pause">⏸</button><input id="t" type="range" min="0" max="24" step="0.05" value="5"></div>
</div>
<script>
var P=[{n:"Guten Morgen",r:"5–10 Uhr",i:"🌅",c:"b0",h:7.5},{n:"Guten Tag",r:"10–18 Uhr",i:"☀️",c:"b1",h:13},{n:"Guten Abend",r:"18–22 Uhr",i:"🌆",c:"b2",h:19.5},{n:"Gute Nacht",r:"22–5 Uhr",i:"🌙",c:"b3",h:23.5}];
var K=[[0,[11,16,40]],[5,[27,35,80]],[6.5,[246,150,90]],[9,[110,193,240]],[14,[74,168,238]],[17.5,[240,138,93]],[19.5,[58,47,107]],[22,[11,16,40]],[24,[11,16,40]]];
function sky(h){for(var i=1;i<K.length;i++){if(h<=K[i][0]){var a=K[i-1],b=K[i],f=(h-a[0])/(b[0]-a[0]);return a[1].map(function(v,j){return Math.round(v+(b[1][j]-v)*f)})}}return K[0][1]}
function part(h){return h>=5&&h<10?0:h>=10&&h<18?1:h>=18&&h<22?2:3}
var $=function(i){return document.getElementById(i)},sc=$("scene"),st=$("stars"),sun=$("sun"),moon=$("moon"),city=$("city");
for(var i=0;i<45;i++){var s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*70+"%";s.style.opacity=.4+Math.random()*.6;st.appendChild(s)}
var wins=[];
for(var i=0;i<6;i++){var d=document.createElement("div");d.className="h";d.style.height=(45+((i*37)%50))+"%";d.innerHTML="<i></i><i></i><i></i><i></i>";city.appendChild(d)}
var bt=$("btns");
P.forEach(function(p,k){var b=document.createElement("button");b.className=p.c;b.innerHTML="<span>"+p.i+"</span>"+p.n+"<small>"+p.r+"</small>";b.onclick=function(){go(p.h);say(p.n)};bt.appendChild(b)});
var H=5,playing=true,cur=-1,last=0;
function night(h){return h<5.5||h>20.5?1:h<7?1-(h-5.5)/1.5:h>19?(h-19)/1.5:0}
function draw(){
  var c=sky(H),n=night(H);
  sc.style.background="linear-gradient(rgb("+c+"),rgb("+c.map(function(v){return Math.min(255,v+60)})+"))";
  st.style.opacity=n;
  var ts=(H-6)/12,tm=((H-18+24)%24)/12;
  if(ts>=0&&ts<=1){sun.style.display="";sun.style.left=(8+84*ts)+"%";sun.style.top=(72-58*Math.sin(Math.PI*ts))+"%"}else sun.style.display="none";
  if(tm>=0&&tm<=1){moon.style.display="";moon.style.left=(8+84*tm)+"%";moon.style.top=(72-58*Math.sin(Math.PI*tm))+"%"}else moon.style.display="none";
  var hh=Math.floor(H)%24,mm=Math.floor((H%1)*60/5)*5;
  $("clock").textContent=(hh<10?"0":"")+hh+":"+(mm<10?"0":"")+mm;
  var lit=Math.max(0,Math.min(1,n+(H>17&&H<19?(H-17)/2*.6:0)));
  [].forEach.call(city.querySelectorAll("i"),function(e){e.style.opacity=lit});
  var k=part(H);
  if(k!==cur){cur=k;var g=$("g");g.textContent=P[k].n;$("r").textContent=P[k].r;g.classList.remove("pop");void g.offsetWidth;g.classList.add("pop");
    [].forEach.call(bt.children,function(b,j){b.classList.toggle("on",j===k)})}
  $("t").value=H;
}
function go(h){H=h;draw()}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
$("hello").onclick=function(){say(P[cur].n)};
$("t").oninput=function(){H=parseFloat(this.value);draw()};
$("play").onclick=function(){playing=!playing;this.textContent=playing?"⏸":"▶️"};
function loop(t){var dt=(t-last)/1000;last=t;if(playing&&dt<.5){H=(H+dt*.8)%24;draw()}requestAnimationFrame(loop)}
draw();requestAnimationFrame(loop);
</script>
</body>
</html>
